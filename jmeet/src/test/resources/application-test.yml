spring:
  datasource:
    hikari:
      # Default (10) is too small for the concurrency test in RoomIntegrationTest, which holds
      # two connections per in-flight join() (the outer transaction plus the REQUIRES_NEW one
      # used to isolate the meeting_session race) across up to 40 simultaneous requests.
      maximum-pool-size: 60
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret

server:
  servlet:
    session:
      cookie:
        secure: false

app:
  client:
    base-url: http://localhost:3000
  join-token:
    secret: test-join-token-secret-at-least-32-bytes-long
    ttl: 120s
  auth:
    session-ttl: 30d
    # kept high so functional tests don't trip these; RateLimitIntegrationTest overrides them
    rate-limit:
      login: { limit: 1000, period: 1m }
      register: { limit: 1000, period: 1m }
      reset: { limit: 1000, period: 1m }
      join-token: { limit: 1000, period: 1m }
  storage:
    driver: local
    local-path: build/test-storage
  livekit:
    host: http://localhost:7880
    api-key: devkey
    api-secret: devsecretdevsecretdevsecretdevsecret
  meeting:
    max-participants: 30
    single-meeting-enabled: true
    screen-share-max-concurrent: 2
    chat-snapshot-limit: 50
    reminder-lead-time: 15m
    duration-warning: 5m
    auto-end-grace: 5m
  realtime:
    stomp-relay-port: 61613
  recording:
    bucket: jmeet-recordings-test
    region: us-east-1
    endpoint: http://localhost:9000
    path-style: true
    access-key: test
    secret-key: testsecrettestsecrettestsecret
    layout-url: http://localhost:3100/egress
    max-duration: 2h
