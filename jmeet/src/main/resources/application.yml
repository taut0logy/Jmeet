spring:
  application:
    name: jmeet

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/jmeet}
    username: ${DATABASE_USER:jmeet}
    password: ${DATABASE_PASSWORD:secret}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379/0}

  session:
    data:
      redis:
        repository-type: indexed

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:jmeet}
    password: ${RABBITMQ_PASSWORD:secret}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,email,profile

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  servlet:
    session:
      timeout: 30d
      cookie:
        name: SESSION
        http-only: true
        secure: true
        same-site: lax

app:
  client:
    base-url: ${CLIENT_BASE_URL:https://meet.example.com}
  join-token:
    secret: ${JOIN_TOKEN_SECRET}
    ttl: 120s
  auth:
    session-ttl: 30d
    rate-limit:
      login: { limit: 10, period: 1m }
      register: { limit: 5, period: 1h }
      reset: { limit: 5, period: 1h }
      join-token: { limit: 20, period: 1m }
  jobs:
    max-attempts: 5
    backoff-base: 5s
    backoff-cap: 15m
    concurrency: 4
  outbox:
    poll-interval: 1s
    batch-size: 100
    max-attempts: 10
  mail:
    from: "jmeet <no-reply@jmeet.local>"
  storage:
    driver: ${STORAGE_DRIVER:local}
    local-path: ${STORAGE_LOCAL_PATH:storage}
    bucket: ${S3_BUCKET:jmeet}
    region: ${S3_REGION:us-east-1}
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    path-style: ${S3_PATH_STYLE:true}
  livekit:
    host: ${LIVEKIT_HOST:http://localhost:7880}
    api-key: ${LIVEKIT_API_KEY:devkey}
    api-secret: ${LIVEKIT_API_SECRET:}
  meeting:
    max-participants: ${MEETING_MAX_PARTICIPANTS:30}
    single-meeting-enabled: ${MEETING_SINGLE_MEETING_ENABLED:true}
    screen-share-max-concurrent: ${MEETING_SCREEN_SHARE_MAX_CONCURRENT:2}
    chat-snapshot-limit: ${MEETING_CHAT_SNAPSHOT_LIMIT:50}
    reminder-lead-time: ${MEETING_REMINDER_LEAD_TIME:15m}
    duration-warning: ${MEETING_DURATION_WARNING:5m}
    auto-end-grace: ${MEETING_AUTO_END_GRACE:5m}
  realtime:
    stomp-relay-port: ${STOMP_RELAY_PORT:61613}
  recording:
    bucket: ${RECORDING_S3_BUCKET:jmeet-recordings}
    region: ${RECORDING_S3_REGION:us-east-1}
    endpoint: ${RECORDING_S3_ENDPOINT:http://localhost:9000}
    path-style: ${RECORDING_S3_PATH_STYLE:true}
    access-key: ${RECORDING_S3_ACCESS_KEY:}
    secret-key: ${RECORDING_S3_SECRET_KEY:}
    layout-url: ${RECORDING_LAYOUT_URL:https://meet.example.com/egress}
    max-duration: ${RECORDING_MAX_DURATION:2h}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

---
spring:
  config:
    activate:
      on-profile: local
  data:
    redis:
      repositories:
        enabled: false

server:
  servlet:
    session:
      cookie:
        secure: false

logging:
  level:
    com.taut0logy: DEBUG
    org.springframework.jdbc.core: DEBUG
