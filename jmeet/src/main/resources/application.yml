spring:
  application:
    name: jmeet

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/jmeet}
    username: ${DATABASE_USER:jmeet}
    password: ${DATABASE_PASSWORD:secret}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379/0}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:jmeet}
    password: ${RABBITMQ_PASSWORD:secret}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,email,profile

app:
  jobs:
    max-attempts: 5
    backoff-base: 5s
    backoff-cap: 15m
    concurrency: 4
  outbox:
    poll-interval: 1s
    batch-size: 100
    max-attempts: 10
  mail:
    from: "jmeet <no-reply@jmeet.local>"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

---
spring:
  config:
    activate:
      on-profile: local
  data:
    redis:
      repositories:
        enabled: false

logging:
  level:
    com.taut0logy: DEBUG
    org.springframework.jdbc.core: DEBUG
