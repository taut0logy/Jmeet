services:
  app:
    image: ghcr.io/taut0logy/jmeet:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    depends_on: [postgres, redis, rabbitmq]
    networks: [internal]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=jmeet
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks: [internal]

  rabbitmq:
    build: ./docker/rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
      - RABBITMQ_ERLANG_COOKIE=${RABBITMQ_ERLANG_COOKIE}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [internal]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9011"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    networks: [internal]

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    depends_on: [redis]
    ports:
      - '7880:7880'
      - '7881:7881'
      - '3478:3478/udp'
      - '50000-60000:50000-60000/udp'
    volumes:
      - ./docker/livekit/livekit.prod.yaml:/etc/livekit.yaml:ro
    networks: [internal]

  egress:
    image: livekit/egress:latest
    restart: unless-stopped
    depends_on: [livekit, redis]
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress.yaml
    volumes:
      - ./docker/livekit/egress.prod.yaml:/etc/egress.yaml:ro
    shm_size: 1gb
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app, livekit, minio]
    ports:
      - '80:80'
      - '443:443'
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    env_file: .env
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
    networks: [internal]

networks:
  internal:

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  caddy-data:
  caddy-config:
