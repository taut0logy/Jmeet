services:
  postgres:
    image: 'postgres:17-alpine'
    environment:
      - 'POSTGRES_DB=jmeet'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=jmeet'
    ports:
      - '5432'
    volumes:
      - ../data/dev/postgres:/var/lib/postgresql/data
  redis:
    image: 'redis:7-alpine'
    ports:
      - '6379'
    volumes:
      - ../data/dev/redis:/data
  mailpit:
    image: axllent/mailpit:latest
    environment:
      - 'MP_DATABASE=/data/mailpit.db'
    ports:
      - '1025:1025'
      - '8025:8025'
    volumes:
      - ../data/dev/mailpit:/data
  rabbitmq:
    build: ./docker/rabbitmq
    environment:
      - 'RABBITMQ_DEFAULT_USER=jmeet'
      - 'RABBITMQ_DEFAULT_PASS=secret'
      - 'RABBITMQ_ERLANG_COOKIE=jmeetdevcookie'
    ports:
      - '5672:5672'
      - '61613:61613'
      - '15672:15672'
    volumes:
      - ../data/dev/rabbitmq:/var/lib/rabbitmq
