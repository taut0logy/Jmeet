services:
  postgres:
    image: 'postgres:17-alpine'
    environment:
      - 'POSTGRES_DB=jmeet'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=jmeet'
    ports:
      - '5432'
    volumes:
      - ../data/dev/postgres:/var/lib/postgresql/data
  redis:
    image: 'redis:7-alpine'
    ports:
      - '6379'
    volumes:
      - ../data/dev/redis:/data
  mailpit:
    image: axllent/mailpit:latest
    environment:
      - 'MP_DATABASE=/data/mailpit.db'
    ports:
      - '1025:1025'
      - '8025:8025'
    volumes:
      - ../data/dev/mailpit:/data
  rabbitmq:
    build: ./docker/rabbitmq
    environment:
      - 'RABBITMQ_DEFAULT_USER=jmeet'
      - 'RABBITMQ_DEFAULT_PASS=secret'
      - 'RABBITMQ_ERLANG_COOKIE=jmeetdevcookie'
    ports:
      - '5672:5672'
      - '61613:61613'
      - '15672:15672'
    volumes:
      - ../data/dev/rabbitmq:/var/lib/rabbitmq
  # Optional: only needed if app.storage.driver=s3 for local testing.
  # Default driver is `local`, which needs none of this.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9011"
    environment:
      - 'MINIO_ROOT_USER=jmeet'
      - 'MINIO_ROOT_PASSWORD=jmeetsecret'
    ports:
      - '9010:9000'
      - '9011:9011'
    volumes:
      - ../data/dev/minio:/data
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set jmeet http://minio:9000 jmeet jmeetsecret; do sleep 1; done;
      mc mb -p jmeet/jmeet;
      "
